name: Scrape and publish

on:
  schedule:
    - cron: "0 13 * * 1"  # ~8am Central, Mondays only (6 neighborhoods x 1 call = 6/wk, ~26/mo, under RentCast's 50/mo free cap)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python main.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
